id: media_agent
name: 多媒体助手
description: 将图片编辑或视频剪辑、讲解目标交接给受控工作区；模型调用、文件生成和确认均在工作区显式完成。
category: 多媒体处理
version: 0.1.0
icon: icons/vision.svg
sort_order: 34
enabled: true
# 当前只批准由 Commander 引导进入工作区；实际模型调用仍由工作区内的显式提交和独立任务链负责。
runtime_ready: false
health: ready
maturity: experimental
llm:
  provider: inherit
  model: inherit
  allow_override: true
tools:
  - ui.open_media_workspace
  - ui.open_video_workspace
permissions:
  file_read: false
  file_write: false
  network: false
  shell: false
  database: false
ui:
  type: qt_builtin_page
  config: media_workspace
capabilities:
  - 图片 AI 编辑目标交接
  - 受控图片版本与预览
  - 用户确认后提交 AI 修图
  - 受控短视频剪辑与离线讲解网页交接
